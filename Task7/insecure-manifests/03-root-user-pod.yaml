apiVersion: v1
kind: Pod
metadata:
  name: pod-root-user
  namespace: audit-zone
  labels:
    app: task7-insecure
    violation: root-user
spec:
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
  containers:
    - name: nginx
      image: nginx:1.25-alpine
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
